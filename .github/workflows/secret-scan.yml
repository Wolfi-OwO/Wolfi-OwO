name: Secret scan

# Scans the working tree for committed secrets on every push and pull request, and once a week. The same job runs
# in the other repositories (see their security.yml). It scans files, not git history, so a secret that was never
# committed is caught too (`gitleaks detect` without --no-git would skip it).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install gitleaks
        env:
          # An unauthenticated call to the releases API is rate-limited per runner address and answers 403 often
          # enough to fail the scan on an unrelated change; the token lifts that limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Downloaded to a file with retries: GitHub's download host drops connections now and then.
          RETRY=(--retry 6 --retry-all-errors --retry-delay 5)
          VERSION="$(curl -sSf "${RETRY[@]}" -H "Authorization: Bearer ${GITHUB_TOKEN}" https://api.github.com/repos/gitleaks/gitleaks/releases/latest | jq -r .tag_name | tr -d v)"
          curl -sSfL "${RETRY[@]}" -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Run gitleaks (working tree, not git history)
        run: gitleaks detect --no-git --source . --redact --verbose
